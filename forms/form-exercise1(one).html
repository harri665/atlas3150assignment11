<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2020 Conference Speaker Proposal Form</title>

<link rel="stylesheet" href="css/form.css" />
</head>

<body>

<div id="wrapper">
<form action="" method="post" id="proposal2020">

<div id="formcol1">

 <h1>2020 Proposal Form</h1>

 <p class="instructions">Use this form to propose a presentation for the 2020 conference.
 Fields marked with an asterisk (<span class="req-mark" aria-hidden="true">*</span>) and a yellow
 background are required. Choose the type of presentation, then select
 &ldquo;Submit your proposal&rdquo;.</p>

 <fieldset>
 <legend>Speaker Info</legend>
 <ul>
    <li>
        <label for="fstspkr1">First Name<span class="req-mark" aria-hidden="true">*</span>:</label>
        <input id="fstspkr1" name="fstspkr1" type="text" class="reqfield" aria-required="true" autocomplete="given-name" />
    </li>
    <li>
        <label for="lstname1">Last Name<span class="req-mark" aria-hidden="true">*</span>:</label>
        <input id="lstname1" name="lstname1" type="text" class="reqfield" aria-required="true" autocomplete="family-name" />
    </li>
    <li>
        <label for="spkrtitle1">Title:</label>
        <input id="spkrtitle1" name="spkrtitle1" type="text" maxlength="48" autocomplete="organization-title" />
    </li>
    <li>
        <label for="company1">Company:</label>
        <input id="company1" name="company1" type="text" autocomplete="organization" />
    </li>
    <li>
        <label for="department1">Department:</label>
        <input id="department1" name="department1" type="text" />
    </li>
    <li>
        <label for="address1">Address<span class="req-mark" aria-hidden="true">*</span>:</label>
        <input id="address1" name="address1" type="text" class="reqfield" aria-required="true" autocomplete="street-address" />
    </li>
 </ul>
 </fieldset>

</div>

<div id="multchoice">

    <fieldset>
    <legend>Type of Presentation</legend>

        <p><span><input value="1" id="TypeofPres_lec" name="p-type" type="radio" /><label for="TypeofPres_lec">Lecture</label></span>
           <span><input value="2" id="TypeofPres_lab" name="p-type" type="radio" /><label for="TypeofPres_lab">Computer Lab</label></span></p>
    </fieldset>

    <p class="submit-button">
        <input type="submit" value="Submit your proposal" /></p>
</div>

</form>

</div>
</body>
</html>
